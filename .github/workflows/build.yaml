name: Release Build

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to upload the build to, for example v1.0.0'
        required: false
        type: string
  pull_request:
    branches: [ main ]
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  BUILD_EXE: .Source/GTweak/bin/Release/GTweak.exe

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        run: nuget restore GTweak.sln

      - name: Build the solution (Release)
        run: msbuild GTweak.sln /t:Rebuild /p:Configuration=Release

      - name: Verify single-file build
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:BUILD_EXE}")) {
            throw "Build output was not found: ${env:BUILD_EXE}"
          }

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GTweak
          path: ${{ env.BUILD_EXE }}

      - name: Upload executable to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.tag_name != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
          files: ${{ env.BUILD_EXE }}
